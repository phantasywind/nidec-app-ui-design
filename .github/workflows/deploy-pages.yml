# Builds and deploys the interactive specification dictionary & component preview
# site to GitHub Pages (https://phantasywind.github.io/nidec-app-ui-design/).
#
# Completely independent of release.yml and does not alter npm package artifacts.
name: Deploy Preview Site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'styles/**'
      - 'tokens/**'
      - 'docs/**'
      - 'design-system/content/**'
      - 'site/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-pages.yml'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build shared package and preview site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Install root dependencies and build shared package
        run: |
          npm ci
          npm run build

      - name: Install preview site dependencies and build static site
        working-directory: site
        env:
          VITE_BASE_PATH: /nidec-app-ui-design/
        run: |
          npm ci
          npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
