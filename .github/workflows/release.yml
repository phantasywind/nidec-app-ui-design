# Immutable release workflow for @phantasywind/nidec-app-ui-design (ADR-0007).
#
# Run manually. With dry_run=true (the default) it only qualifies a candidate:
# two independent builds, all repository checks, byte comparison, SHA-256.
# With dry_run=false it additionally tags, publishes to GitHub Packages and
# creates the GitHub Release, and only if approved_sha256 equals the candidate.
#
# Control model (ADR-0007): this is single-party control. approved_sha256 binds
# the publication to the candidate the repository owner authorized in writing;
# it is a consistency check, not a security control. Run dry_run=false only
# after that authorization has been recorded in the release record.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version to release. Must equal package.json.
        required: true
        type: string
      dry_run:
        description: Qualify only. Set to false to publish after the owner's authorization is recorded.
        required: true
        type: boolean
        default: true
      approved_sha256:
        description: SHA-256 of the candidate archive the owner authorized. Required when dry_run is false. Consistency check, not a security control.
        required: false
        type: string

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify build ${{ matrix.build }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        build: [a, b]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check version input
        run: |
          actual=$(node -p "require('./package.json').version")
          if [ "$actual" != "${{ inputs.version }}" ]; then
            echo "package.json version is $actual, input is ${{ inputs.version }}" >&2
            exit 1
          fi
          test -f "docs/releases/${{ inputs.version }}.md"
      - run: npm ci
      - run: npm run verify
      - name: Pack
        run: |
          mkdir -p out
          npm pack --pack-destination out
          cd out && sha256sum *.tgz | tee ../sha256-${{ matrix.build }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.build }}
          path: |
            out/*.tgz
            sha256-${{ matrix.build }}.txt
          if-no-files-found: error

  compare:
    name: Compare independent builds
    needs: qualify
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.sha.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          path: candidates
      - name: Compare and summarise
        id: sha
        run: |
          a=$(cut -d' ' -f1 candidates/candidate-a/sha256-a.txt)
          b=$(cut -d' ' -f1 candidates/candidate-b/sha256-b.txt)
          if [ "$a" != "$b" ]; then
            echo "Independent builds differ: $a vs $b" >&2
            exit 1
          fi
          echo "sha256=$a" >> "$GITHUB_OUTPUT"
          echo "Candidate SHA-256 (builds a and b byte-identical): $a"
          {
            echo "## Release candidate ${{ inputs.version }}"
            echo
            echo "Source commit: \`${GITHUB_SHA}\`"
            echo
            echo "SHA-256 (two independent builds, byte-identical): \`$a\`"
            echo
            echo "Dry run: ${{ inputs.dry_run }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check the version is new
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ inputs.version }} already exists. Published versions are never reused." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: candidate
          path: candidates/candidate-a/out/*.tgz
          if-no-files-found: error

  publish:
    name: Publish
    needs: compare
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Require the approved candidate hash
        run: |
          if [ "${{ inputs.approved_sha256 }}" != "${{ needs.compare.outputs.sha256 }}" ]; then
            echo "approved_sha256 does not match the qualified candidate." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@phantasywind'
      - uses: actions/download-artifact@v4
        with:
          name: candidate
          path: candidate
      - name: Verify the downloaded archive
        run: |
          cd candidate
          sha256sum *.tgz | cut -d' ' -f1 | grep -qx "${{ needs.compare.outputs.sha256 }}"
          sha256sum *.tgz > SHA256SUMS.txt
      - name: Create the tag locally for the authorization check
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${{ inputs.version }}" "$GITHUB_SHA"
      - run: npm ci
      - name: Check publication inputs and authorization
        env:
          NIDEC_UI_RELEASE_APPROVED: ${{ inputs.version }}
        run: |
          npm run publication:check
          npm run release:authorize
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "${{ inputs.version }}" in
            *-*) tag=next ;;
            *)   tag=latest ;;
          esac
          # The ./ matters: without it npm reads candidate/x.tgz as a GitHub repository.
          npm publish ./candidate/*.tgz --tag "$tag"
      - name: Push the immutable tag after successful publication
        run: git push origin "refs/tags/v${{ inputs.version }}"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          case "${{ inputs.version }}" in *-*) flags="--prerelease" ;; esac
          gh release create "v${{ inputs.version }}" candidate/*.tgz candidate/SHA256SUMS.txt \
            --verify-tag $flags \
            --title "${{ inputs.version }}" \
            --notes-file "docs/releases/${{ inputs.version }}.md"
      - name: Verify the published package and the Release asset
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED: ${{ needs.compare.outputs.sha256 }}
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          mkdir -p verify/registry verify/release
          # What the registry serves, downloaded back as a tarball.
          npm pack "@phantasywind/nidec-app-ui-design@${version}" --pack-destination verify/registry --registry https://npm.pkg.github.com
          registry_sha=$(sha256sum verify/registry/*.tgz | cut -d' ' -f1)
          # What the GitHub Release carries.
          gh release download "v${version}" --dir verify/release
          release_sha=$(sha256sum verify/release/*.tgz | cut -d' ' -f1)
          listed_sha=$(cut -d' ' -f1 verify/release/SHA256SUMS.txt)
          {
            echo "## Post-publication verification for ${version}"
            echo
            echo "| Source | SHA-256 |"
            echo "| --- | --- |"
            echo "| Authorized candidate | \`${EXPECTED}\` |"
            echo "| Registry download | \`${registry_sha}\` |"
            echo "| Release archive | \`${release_sha}\` |"
            echo "| Release SHA256SUMS.txt | \`${listed_sha}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Authorized candidate: ${EXPECTED}"
          echo "Registry download:    ${registry_sha}"
          echo "Release archive:      ${release_sha}"
          echo "Release SHA256SUMS:   ${listed_sha}"
          for value in "${registry_sha}" "${release_sha}" "${listed_sha}"; do
            if [ "${value}" != "${EXPECTED}" ]; then
              echo "Published content does not match the authorized candidate." >&2
              exit 1
            fi
          done
          echo "Registry, Release archive and SHA256SUMS.txt all match the authorized candidate."
